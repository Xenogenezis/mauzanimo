<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rehome responsibly. Adopt locally. Pet rehoming in Mauritius by JCI Grand Baie.">
  <meta name="theme-color" content="#2A9D8F">

  <!-- Open Graph (link previews) -->
  <meta property="og:title" content="MauZanimo">
  <meta property="og:description" content="Rehome responsibly. Adopt locally. Pet rehoming in Mauritius by JCI Grand Baie.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MauZanimo">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MauZanimo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MauZanimo</title>
  <link rel="manifest" href="manifest.json">
  <script>
    // Firebase SDK v12+ checks for Node.js `global` in browsers — polyfill before any scripts load.
    var global = window;
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #2A9D8F; }
    /* Splash shown until Flutter paints its first frame. Flutter's view is
       appended after it and covers it; it is also removed on first frame. */
    #app-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px;
      background: #2A9D8F;
      color: #FFFFFF;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 200ms ease-out;
    }
    #app-loading .brand { font-size: 28px; font-weight: 700; letter-spacing: 0.5px; }
    #app-loading .spinner {
      width: 40px; height: 40px; box-sizing: border-box;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top-color: #E9C46A;
      border-radius: 50%;
      animation: app-loading-spin 0.9s linear infinite;
    }
    @keyframes app-loading-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #app-loading .spinner { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="progressbar" aria-busy="true" aria-label="MauZanimo">
    <div class="brand">MauZanimo</div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 250);
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
