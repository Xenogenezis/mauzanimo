# One-command deploy on a VPS:
#   cp deploy/.env.example deploy/.env   # set DOMAIN and ACME_EMAIL
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    expose: ["80"]

  # Automatic HTTPS (Let's Encrypt) in front of nginx.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]

volumes:
  caddy_data:
  caddy_config:
