# Static hosting for the Flutter web builds. TLS is terminated by Caddy
# (see docker-compose.yml), so this listens on plain HTTP inside the network.
#
# NOTE: headers are set only at server level on purpose. In nginx, any
# add_header inside a location drops ALL inherited server-level headers.

# Flutter's main.dart.js etc. are not content-hashed, so code revalidates on
# every load (cheap 304 via ETag) and new releases show up immediately.
# CanvasKit only changes with a Flutter upgrade; images/fonts rarely change.
map $uri $mz_cache_control {
    ~*/canvaskit/                                     "public, max-age=604800";
    ~*\.(png|jpg|jpeg|svg|ico|ttf|otf|woff2?)$        "public, max-age=604800";
    default                                           "no-cache";
}

map $uri $mz_robots {
    ~^/admin  "noindex, nofollow";
    default   "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control $mz_cache_control always;
    add_header X-Robots-Tag $mz_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    # Flutter web needs 'wasm-unsafe-eval' for CanvasKit; Firebase needs its
    # gstatic SDK, Google APIs and auth popup domains; map tiles come from OSM.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Admin panel (built with --base-href /admin/)
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Public web app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
