# Static hosting for the Flutter web builds. TLS is terminated by Caddy
# (see docker-compose.yml), so this listens on plain HTTP inside the network
# and Strict-Transport-Security is sent by Caddy, not here.
#
# NOTE: headers are set only at server level on purpose. In nginx, any
# add_header inside a location drops ALL inherited server-level headers.
# Per-path differences are done with `map` instead (an add_header whose value
# is empty is not sent at all).

# Flutter's main.dart.js, flutter_bootstrap.js, index.html, version.json and
# the service worker are NOT content-hashed, so they must revalidate on every
# load (cheap 304 via ETag) or new releases would not show up.
# CanvasKit/skwasm only change with a Flutter upgrade; images/fonts rarely
# change, so they get a week (not `immutable`: the file names don't change).
map $uri $mz_cache_control {
    ~*(^|/)(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json)$  "no-cache";
    ~*/canvaskit/                                     "public, max-age=604800";
    ~*\.(png|jpg|jpeg|webp|gif|svg|ico|ttf|otf|woff2?)$  "public, max-age=604800";
    default                                           "no-cache";
}

map $uri $mz_robots {
    ~^/admin  "noindex, nofollow";
    default   "";
}

# ---- Content-Security-Policy ---------------------------------------------
# One policy for both builds (built with --no-web-resources-cdn, so CanvasKit
# is served from 'self' rather than www.gstatic.com):
#  * script-src: 'wasm-unsafe-eval' for CanvasKit/skwasm. No 'unsafe-eval'
#    is needed (checked with Playwright). The sha256 hashes allow exactly
#    these inline scripts: JMBi.. and 536/.. are the two <script> blocks in
#    web/index.html (`var global = window;` polyfill, splash remover);
#    Mz3c.., 2JT4.., olq8.. are the loaders FlutterFire injects at runtime
#    for firebase_core / firebase_firestore / firebase_auth (they embed the
#    Firebase JS SDK version, 12.9.0). Editing those index.html scripts or
#    upgrading the firebase_* plugins CHANGES THE HASHES: re-run
#    deploy/csp_check.cjs (see SECURITY_AUDIT.md) and paste the hashes it
#    prints, or the admin panel stays blank. www.gstatic.com = Firebase JS SDK modules, apis.google.com
#    = Firebase Auth popup helper, accounts.google.com/gsi = Google Sign-In.
#  * style-src 'unsafe-inline': the splash <style> in index.html and the
#    styles the Flutter engine injects at runtime.
#  * connect-src: Firestore/Auth/Storage (*.googleapis.com), RTDB/long-poll
#    (*.firebaseio.com), auth domain (*.firebaseapp.com), Flutter's fallback
#    fonts (fonts.gstatic.com), OSM tiles (flutter_map fetches them over
#    XHR), Google profile photos (*.googleusercontent.com). CanvasKit fetches
#    network images with XHR too, so an image hosted anywhere else will not
#    load in the app (img-src https: only covers <img> elements).
#  * frame-src: Firebase Auth's hidden iframe + Google sign-in.
map $host $mz_csp {
    default "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-JMBi7Jb8BcwtO/xaao74y/+zLjYGwRb7nt+8vA1IiK4=' 'sha256-536/qX5ow6lB8A4AEbXPfhclO6dgtp7SqjpwESSUItQ=' 'sha256-Mz3cULKmYM0+hcRmEfU0dCqvj9ZDQVjNE+yGH51hmXc=' 'sha256-2JT4iZASpJta8lIc705nFdGPACnfUNUt7N8/iaAl5eY=' 'sha256-olq87GIr2hMlg3c8QHzhevhxVUYZesqvHhHYiYzP82U=' https://www.gstatic.com https://apis.google.com https://accounts.google.com/gsi/; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com https://www.gstatic.com https://fonts.gstatic.com https://tile.openstreetmap.org https://*.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://*.firebaseapp.com https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
}

# Enforce on the admin panel (small, known feature set, highest value
# target); Report-Only on the public app, which shows user-supplied image
# URLs and more third-party flows. To enforce everywhere, change the default
# of $mz_csp_enforce to $mz_csp and of $mz_csp_report to "".
# NOTE: there is no report-uri yet, so Report-Only violations only appear in
# the browser console.
map $uri $mz_csp_enforce {
    ~^/admin(/|$)  $mz_csp;
    default        "";
}
map $uri $mz_csp_report {
    ~^/admin(/|$)  "";
    default        $mz_csp;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header Cache-Control $mz_cache_control always;
    add_header X-Robots-Tag $mz_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header Content-Security-Policy $mz_csp_enforce always;
    add_header Content-Security-Policy-Report-Only $mz_csp_report always;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Admin panel (built with --base-href /admin/)
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Public web app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
